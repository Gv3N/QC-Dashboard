<style id="qc-css">
/* ===== QC DASHBOARD STYLES (shared by generator preview and exported dashboard) =====
   Brand tokens are at the top: change these to match corporate colours.
   Status colours (bad = overdue, warn = due soon, ok = on track) carry meaning
   and always appear with an icon or label, never colour alone. */
.qc-root, .qc-root * { box-sizing: border-box; }
.qc-root {
  --ink: #102a43; --ink-2: #334e68; --muted: #627d98; --faint: #9fb3c8;
  --canvas: #f0f3f6; --surface: #ffffff; --rule: #d9e2ec; --rule-soft: #edf1f5; --hover: #f5f8fb;
  --accent: #0b6e79; --accent-ink: #075059; --accent-soft: #e1f1f2;
  --bad: #b42318; --bad-soft: #fdeceb; --bad-line: #f1b4ae;
  --warn: #8a5300; --warn-soft: #fff3d6; --warn-line: #f2c66d;
  --ok: #157046; --ok-soft: #e4f4ec;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --a1: #86b6ef; --a2: #5598e7; --a3: #256abf; --a4: #104281; --a5: #9fb3c8;
  --radius: 8px;
  font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px; line-height: 1.45; color: var(--ink); background: var(--canvas);
  font-variant-numeric: tabular-nums; min-height: 100vh; -webkit-font-smoothing: antialiased;
}
.qc-root button { font: inherit; color: inherit; }
.qc-root h1, .qc-root h2, .qc-root h3, .qc-root p { margin: 0; }
.qc-root .ico { width: 15px; height: 15px; flex: none; vertical-align: -2px; margin-right: 5px; }
.qc-root .muted { color: var(--muted); }
.qc-root .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; word-break: break-all; }
.qc-root .num { text-align: right; white-space: nowrap; }
.qc-root .nw { white-space: nowrap; }
.qc-root .empty { color: var(--muted); padding: 10px 0; display: flex; align-items: center; }
.qc-root .empty .ico { color: var(--ok); }
.qc-root .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
.qc-root :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- header band ---- */
.band { background: var(--ink); color: #fff; }
.band-in { max-width: 1440px; margin: 0 auto; padding: 18px 28px; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; }
.mark { width: 42px; height: 42px; border-radius: 9px; background: var(--accent); display: grid; place-items: center;
  font-weight: 700; font-size: 15px; letter-spacing: .02em; color: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.band h1 { font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
.band .brand p { color: #bcccdc; font-size: 13px; margin-top: 1px; }
.asof { display: flex; gap: 10px; flex-wrap: wrap; }
.asof-item { display: grid; grid-template-columns: auto auto; column-gap: 8px; align-items: center; padding: 7px 14px;
  border: 1px solid rgba(255,255,255,.16); border-radius: 8px; background: rgba(255,255,255,.05); }
.asof-item .dot { grid-row: span 2; width: 9px; height: 9px; border-radius: 50%; }
.dot.fresh { background: #3ccf8e; box-shadow: 0 0 0 3px rgba(60,207,142,.18); }
.dot.stale { background: #f2b84b; box-shadow: 0 0 0 3px rgba(242,184,75,.2); }
.asof-l { font-size: 11px; color: #bcccdc; }
.asof-v { font-size: 14px; font-weight: 600; }

.page { max-width: 1440px; margin: 0 auto; padding: 20px 28px 28px; }
.banner { display: flex; align-items: center; gap: 4px; margin-bottom: 14px; padding: 10px 14px; border-radius: var(--radius);
  background: var(--warn-soft); border: 1px solid var(--warn-line); color: var(--warn); }

/* ---- executive summary (hero) ---- */
.exec { display: grid; gap: 14px; margin-bottom: 18px; }
.exec-dept { display: grid; grid-template-columns: 220px 1fr; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.exec-name { padding: 18px 20px; border-right: 1px solid var(--rule); background: linear-gradient(180deg, #fbfcfd, #f5f8fa); display: flex; flex-direction: column; gap: 2px; }
.exec-name h2 { font-size: 26px; font-weight: 700; letter-spacing: -.01em; color: var(--ink); }
.exec-name p { color: var(--muted); font-size: 13px; }
.exec-name .open { margin-top: auto; align-self: flex-start; border: 0; background: none; padding: 10px 0 0; color: var(--accent); font-weight: 600; cursor: pointer; }
.exec-name .open:hover { color: var(--accent-ink); text-decoration: underline; }
.figs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.fig { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 16px 20px; border: 0; background: none;
  border-left: 1px solid var(--rule-soft); position: relative; min-width: 0; }
.fig:first-child { border-left: 0; }
button.fig { cursor: pointer; }
button.fig:hover { background: var(--hover); }
.fig-l { display: flex; align-items: center; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.fig-v { font-size: 38px; font-weight: 600; line-height: 1.1; letter-spacing: -.02em; color: var(--ink); }
.fig-v small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 5px; letter-spacing: 0; }
.fig-n { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.fig.bad .fig-v, .fig.bad .fig-l { color: var(--bad); }
.fig.bad::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--bad); }
.fig.warn .fig-v, .fig.warn .fig-l { color: var(--warn); }
.fig.warn::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: #e0a100; }
.fig.ok .fig-l { color: var(--ok); }

/* ---- cards ---- */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 18px 10px; }
.card-head h2 { font-size: 16px; font-weight: 600; }
.key { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }

/* ---- status matrix ---- */
.matrix { margin-bottom: 22px; }
.mx-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; padding: 0 18px 14px; }
.mx { border-collapse: collapse; width: 100%; font-size: 13px; align-self: start; }
.mx th, .mx td { padding: 4px 6px; }
.mx thead th { color: var(--muted); font-weight: 600; font-size: 12px; text-align: center; border-bottom: 1px solid var(--rule); }
.mx thead .mx-dept { color: var(--ink); font-size: 13px; padding-bottom: 0; border-bottom: 0; }
.mx thead .mx-cat { text-align: left; vertical-align: bottom; }
.mx .mx-h { width: 74px; font-weight: 500; }
.mx tbody th.mx-cat { text-align: left; font-weight: 500; color: var(--ink); }
.mx tbody tr:not(.mx-sec):hover { background: var(--hover); }
.mx tbody tr:not(.mx-sec) { border-bottom: 1px solid var(--rule-soft); }
.mx .mx-sec th { text-align: left; font-size: 12px; font-weight: 600; color: var(--accent-ink); padding: 12px 6px 4px; border-bottom: 1px solid var(--rule); }
.mx .mx-n { text-align: center; }
.mx .zero { color: var(--faint); }
.chip { display: inline-block; min-width: 34px; padding: 1px 9px; border-radius: 12px; font-weight: 700; font-size: 13px; text-align: center; border: 1px solid transparent; line-height: 20px; }
button.chip { cursor: pointer; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad-line); }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); }
button.chip:hover { filter: brightness(.96); box-shadow: 0 0 0 2px currentColor inset; }
.chip.static { min-width: 0; padding: 0 7px; font-size: 11px; line-height: 17px; }
.chip.none { background: var(--rule-soft); color: var(--faint); border-color: var(--rule); }

/* ---- navigation ---- */
.navbar { position: sticky; top: 0; z-index: 20; background: var(--canvas); padding-top: 6px; margin: 0 -28px; padding-left: 28px; padding-right: 28px; }
.seg { display: inline-flex; gap: 4px; padding: 4px; background: #e2e8ee; border-radius: 10px; }
.seg button { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 8px 16px; border-radius: 7px; cursor: pointer; color: var(--ink-2); }
.seg button b { font-size: 15px; }
.seg button span { font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(16,42,67,.14), 0 0 0 1px rgba(16,42,67,.06); }
.seg button.on b { color: var(--accent-ink); }
.secnav { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); margin-top: 10px; overflow-x: auto; }
.secnav button { display: flex; align-items: center; gap: 7px; border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--ink-2);
  border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 500; }
.secnav button:hover { color: var(--accent); }
.secnav button.on { color: var(--accent-ink); border-bottom-color: var(--accent); font-weight: 600; }
.cnt { font-style: normal; display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
.cnt.bad { background: var(--bad); color: #fff; }
.cnt.warn { background: #e0a100; color: #3d2600; }

/* ---- section content ---- */
.content { padding-top: 18px; }
.head { margin-bottom: 14px; }
.head h2 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.head p { color: var(--muted); margin-top: 2px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.pills button { display: flex; align-items: center; gap: 7px; border: 1px solid var(--rule); background: var(--surface); border-radius: 18px; padding: 6px 14px; cursor: pointer; color: var(--ink-2); }
.pills button:hover { border-color: var(--accent); color: var(--accent-ink); }
.pills button.on { background: var(--ink); border-color: var(--ink); color: #fff; }

.kgroup { margin-bottom: 20px; }
.kgroup h3, .viz h3 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 8px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
.kpi { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; padding: 14px 18px 14px; border: 0; background: none; cursor: pointer;
  box-shadow: -1px 0 0 var(--rule-soft), 0 -1px 0 var(--rule-soft); position: relative; min-width: 0; }
.kpi:hover { background: var(--hover); }
.kpi-l { display: flex; align-items: center; font-size: 13px; color: var(--ink-2); }
.kpi-v { font-size: 30px; font-weight: 600; line-height: 1.12; letter-spacing: -.015em; }
.kpi-s { font-size: 12px; color: var(--muted); min-height: 17px; }
.kpi.bad .kpi-l, .kpi.bad .kpi-v { color: var(--bad); }
.kpi.bad::before, .kpi.warn::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 2px 2px 0; }
.kpi.bad::before { background: var(--bad); }
.kpi.warn .kpi-l, .kpi.warn .kpi-v { color: var(--warn); }
.kpi.warn::before { background: #e0a100; }
.meter { display: block; width: 100%; max-width: 160px; height: 6px; border-radius: 3px; background: var(--rule-soft); overflow: hidden; margin: 2px 0 1px; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

.age { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 18px; }
.agebar { display: flex; gap: 2px; height: 30px; border-radius: 6px; overflow: hidden; }
.agebar button { flex-basis: 0; min-width: 6px; border: 0; cursor: pointer; color: #fff; font-weight: 700; font-size: 12px; }
.agebar button:hover { filter: brightness(1.08); }
.seg-1 { background: var(--a1); } .agebar .seg-1 { color: var(--ink); }
.seg-2 { background: var(--a2); } .seg-3 { background: var(--a3); } .seg-4 { background: var(--a4); } .seg-5 { background: var(--a5); }
.agekey { display: flex; gap: 6px 18px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
.agekey-i { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 2px 0; }
button.agekey-i { cursor: pointer; } button.agekey-i:hover { color: var(--accent-ink); }
.agekey b { color: var(--ink); }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; flex: none; }

.viz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; margin-bottom: 20px; }
.viz { padding: 14px 18px; min-width: 0; }
.viz.wide { grid-column: 1 / -1; }
.viz-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.viz svg { width: 100%; height: auto; display: block; margin-top: 6px; }
.viz .grid { stroke: var(--rule-soft); stroke-width: 1; }
.viz .base { stroke: var(--faint); stroke-width: 1; }
.viz .ax { fill: var(--muted); font-size: 12px; font-family: inherit; }
.viz .hit { fill: transparent; cursor: pointer; }
.viz .bar { cursor: pointer; }
.viz .bar:hover, .viz .hit:hover + .bar { opacity: .82; }
.s1 { fill: var(--s1); background: var(--s1); } .s2 { fill: var(--s2); background: var(--s2); } .s3 { fill: var(--s3); background: var(--s3); }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { color: var(--ink); font-weight: 600; }
.bd { display: flex; flex-direction: column; gap: 1px; }
.bd-row { display: grid; grid-template-columns: minmax(120px, 2.2fr) 1.4fr 40px; gap: 10px; align-items: center; border: 0; background: none;
  padding: 6px 6px; border-radius: 5px; cursor: pointer; text-align: left; }
.bd-row:hover { background: var(--accent-soft); }
.bd-label { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd-bar { height: 8px; background: var(--rule-soft); border-radius: 4px; overflow: hidden; }
.bd-bar i { display: block; height: 100%; background: var(--s1); border-radius: 4px; }
.bd-n { text-align: right; font-weight: 600; }
.big { font-size: 36px; font-weight: 600; color: var(--warn); line-height: 1.1; }

/* ---- overview ---- */
.ov { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; margin-bottom: 20px; }
.ov-main { overflow: hidden; }
.ov-main .tbl-wrap { padding: 0 6px; }
.ov-main .btn { margin: 10px 18px 16px; }
.ov-main .empty { padding: 6px 18px 18px; }
.secsum { list-style: none; margin: 0; padding: 0 8px 4px; }
.secsum button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 0; background: none; padding: 9px 10px;
  border-radius: 6px; cursor: pointer; text-align: left; border-top: 1px solid var(--rule-soft); }
.secsum li:first-child button { border-top: 0; }
.secsum button:hover { background: var(--hover); }
.secsum-v { display: flex; gap: 6px; }
.ov-side .note { padding: 0 18px 14px; }

/* ---- tables ---- */
.tbl-wrap { overflow-x: auto; }
.qc-root table.list { border-collapse: collapse; width: 100%; font-size: 13px; }
.qc-root table.list th, .qc-root table.list td { padding: 8px 12px; border-bottom: 1px solid var(--rule-soft); text-align: left; vertical-align: top; }
.qc-root table.list thead th { color: var(--muted); font-weight: 600; font-size: 12px; background: #f8fafc; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.qc-root table.list tbody tr:hover { background: var(--hover); }
.qc-root table.list tbody tr:last-child td, .qc-root table.list tbody tr:last-child th { border-bottom: 0; }
.qc-root table.kv th { width: 160px; color: var(--ink-2); font-weight: 600; background: none; }
.tag { display: inline-flex; align-items: center; padding: 2px 9px 2px 7px; border-radius: 12px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.tag .ico { width: 13px; height: 13px; margin-right: 4px; }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.qc-root .btn { border: 1px solid var(--accent); background: var(--surface); color: var(--accent-ink); border-radius: 6px; padding: 6px 14px; cursor: pointer; font-weight: 600; }
.qc-root .btn:hover { background: var(--accent-soft); }
.qc-root .link { border: 0; background: none; color: var(--accent-ink); cursor: pointer; padding: 0; text-decoration: underline; font-weight: 600; }

.foot { margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ---- drill-down dialog ---- */
.qc-modal { position: fixed; inset: 0; background: rgba(16, 42, 67, .5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px; }
.qc-modal[hidden] { display: none; }
.qc-dialog { background: var(--surface); border-radius: 12px; width: min(1240px, 100%); max-height: 100%; display: flex; flex-direction: column;
  box-shadow: 0 24px 60px rgba(16,42,67,.35); overflow: hidden; }
.qc-dhead { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: var(--ink); color: #fff; gap: 12px; }
.qc-dhead h2 { font-size: 16px; font-weight: 600; }
.qc-dhead .x { border: 0; background: none; font-size: 26px; cursor: pointer; line-height: 1; color: #bcccdc; }
.qc-dhead .x:hover { color: #fff; }
.qc-dtools { display: flex; gap: 12px; align-items: center; padding: 12px 20px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.qc-dtools input { font: inherit; padding: 7px 12px; border: 1px solid var(--rule); border-radius: 6px; min-width: 280px; }
.qc-dtools input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.qc-dtools .btn { margin-left: auto; }
.qc-dbody { overflow: auto; }
.qc-dbody table.list thead th { position: sticky; top: 0; cursor: pointer; user-select: none; z-index: 1; }
.qc-dbody table.list thead th:hover { color: var(--accent-ink); }
.qc-dbody td.nw { white-space: nowrap; }
.qc-dbody td.wrap { min-width: 200px; }
.qc-dbody.defs { padding: 16px 22px; }
.qc-dbody.defs h3 { font-size: 14px; margin: 14px 0 6px; color: var(--ink); }
.qc-dbody.defs h3:first-child { margin-top: 0; }
.qc-dbody.defs ul { margin: 0; padding-left: 20px; color: var(--ink-2); }
.qc-dbody.defs li { margin: 3px 0; max-width: 90ch; }
.qc-tip { position: fixed; z-index: 60; background: var(--ink); color: #fff; font-size: 12px; padding: 5px 9px; border-radius: 5px; pointer-events: none; box-shadow: 0 4px 12px rgba(16,42,67,.25); }
.qc-tip[hidden] { display: none; }

/* ---- responsive ---- */
@media (max-width: 1180px) {
  .figs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .fig:nth-child(4) { border-left: 0; }
  .fig:nth-child(n+4) { border-top: 1px solid var(--rule-soft); }
  .mx-cols { grid-template-columns: 1fr; }
  .ov { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .band-in, .page { padding-left: 16px; padding-right: 16px; }
  .navbar { margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
  .exec-dept { grid-template-columns: 1fr; }
  .exec-name { border-right: 0; border-bottom: 1px solid var(--rule); flex-direction: row; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .exec-name .open { margin: 0 0 0 auto; padding: 0; }
  .figs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fig:nth-child(n) { border-left: 0; border-top: 1px solid var(--rule-soft); }
  .fig:nth-child(2n) { border-left: 1px solid var(--rule-soft); }
  .fig:nth-child(-n+2) { border-top: 0; }
  .fig-v { font-size: 30px; }
  .fig-n { white-space: normal; }
  .seg button span { display: none; }
  .qc-dtools input { min-width: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .qc-root * { transition: none !important; scroll-behavior: auto !important; } }
@media print {
  .qc-modal, .qc-tip, .navbar .seg, .exec-name .open { display: none !important; }
  .qc-root { background: #fff; }
  .navbar { position: static; }
  .band { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .card, .kpis, .age, .exec-dept { break-inside: avoid; }
}

</style>
</head>

<script id="qc-core">
/* ==========================================================================
   QC DASHBOARD CORE
   Shared by generator.html (preview) and the exported dashboard.html.
   The exported dashboard contains exactly this script, unchanged.

   HOW TO ADD A TAB  (instructions for maintainers and Copilot)
   ---------------------------------------------------------------
   A. New tab with the SAME data shape as an existing one
      (for example a "Change Control" tab that uses the event columns):
        1. Add one line to CATEGORIES below, e.g.
             { key: 'CC', sheet: 'ChangeControl', label: 'Change Control',
               section: 'qms', shape: 'event' },
        2. Add a sheet called "ChangeControl" to BOTH department workbooks,
           with the columns listed in SHAPES.event.columns (row 1 = headers).
        3. Optional: add a row "CC" to config.xlsx > Categories to set
           due_soon_days. Without it, Settings > default_due_soon_days is used.
      No other code changes are needed.

   B. New tab with a NEW data shape (different columns or metrics):
        1. Add a new entry to SHAPES (copy SHAPES.planner as a starting point).
           A shape has: columns, check(), compute(), drill, defs.
        2. compute() must only use the helper functions in section 3 for
           dates, so all date maths stays in one place.
        3. Add the category line to CATEGORIES (step A1) with shape: 'yourShape'.
        4. Add hand-calculated test cases for it in the SELF-TEST script
           of generator.html.

   C. New section (top-level tab inside a department): add to SECTIONS.

   AFTER ANY CHANGE: open generator.html, click "Run self-test".
   Every test must PASS before you export a dashboard.

   RULES THAT MUST NOT CHANGE WITHOUT REVALIDATION
     - All date maths uses whole calendar days in UTC (functions dn/isoFromDn).
     - "Today" for every metric is data_as_of from the workbook Meta sheet,
       never the viewer's clock.
     - Overdue  = due date  <  data_as_of   (due today is NOT overdue).
     - Due soon = data_as_of <= due date <= data_as_of + due_soon_days.
   ========================================================================== */
var QCCore = (function () {
  'use strict';

  var VERSION = '1.0.0';

  /* ------------------------------------------------------------------------
     1. DEPARTMENTS AND SECTIONS
     ------------------------------------------------------------------------ */
  var DEPTS = [
    { key: 'QCA', name: 'QC Analytical' },
    { key: 'QCM', name: 'QC Microbiology' }
  ];

  var SECTIONS = [
    { key: 'overview', label: 'Overview' },
    { key: 'qms', label: 'QMS Events' },
    { key: 'samples', label: 'Samples' },
    { key: 'csv', label: 'CSV Activity' },
    { key: 'itrisk', label: 'IT Risk & Remediation' },
    { key: 'dq', label: 'Data quality' }
  ];

  /* ------------------------------------------------------------------------
     2. TAB REGISTRY  (one line per category; order = display order)
        key     : internal id, also used in config.xlsx > Categories
        sheet   : sheet name in the department workbook
        section : which SECTIONS entry it appears under
        shape   : which SHAPES entry defines its columns and metrics
     ------------------------------------------------------------------------ */
  var CATEGORIES = [
    { key: 'CAPA',     sheet: 'CAPA',            label: 'CAPA',                        section: 'qms',     shape: 'event' },
    { key: 'DEV',      sheet: 'Deviation',       label: 'Deviations',                  section: 'qms',     shape: 'event' },
    { key: 'OOS',      sheet: 'OOS',             label: 'OOS',                         section: 'qms',     shape: 'event' },
    { key: 'OOT',      sheet: 'OOT',             label: 'OOT',                         section: 'qms',     shape: 'event' },
    { key: 'TAT',      sheet: 'TAT',             label: 'Batch TAT',                   section: 'qms',     shape: 'tat' },
    { key: 'SAMPLES',  sheet: 'Samples',         label: 'Samples',                     section: 'samples', shape: 'samples' },
    { key: 'PR',       sheet: 'CSV_PR',          label: 'Periodic Review',             section: 'csv',     shape: 'pr' },
    { key: 'ADHOC',    sheet: 'CSV_AdHoc',       label: 'Ad hoc requests & troubleshooting', section: 'csv', shape: 'adhoc' },
    { key: 'TIMESYNC', sheet: 'CSV_TimeSync',    label: 'Time sync',                   section: 'csv',     shape: 'planner' },
    { key: 'UAM',      sheet: 'CSV_UAM',         label: 'UAM',                         section: 'csv',     shape: 'planner' },
    { key: 'BACKUP',   sheet: 'CSV_Backup',      label: 'Backup',                      section: 'csv',     shape: 'planner' },
    { key: 'RESTORE',  sheet: 'CSV_Restoration', label: 'Restoration',                 section: 'csv',     shape: 'planner' },
    { key: 'OSHARD',   sheet: 'CSV_OSHardening', label: 'OS hardening',                section: 'csv',     shape: 'planner' },
    { key: 'ITRISK',   sheet: 'IT_Risk',         label: 'IT risk & remediation',       section: 'itrisk',  shape: 'itrisk' }
  ];

  /* ------------------------------------------------------------------------
     3. DATE HELPERS  (ISO yyyy-mm-dd strings; whole days in UTC)
     ------------------------------------------------------------------------ */
  var DAY = 86400000;
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function validYMD(y, m, d) {
    if (m < 1 || m > 12 || d < 1 || d > 31) return false;
    var dt = new Date(Date.UTC(y, m - 1, d));
    return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
  }
  function isISO(s) {
    return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) &&
      validYMD(+s.slice(0, 4), +s.slice(5, 7), +s.slice(8, 10));
  }
  /* day number of an ISO date (days since 1970-01-01) */
  function dn(iso) {
    return Math.round(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)) / DAY);
  }
  function isoFromDn(n) { return new Date(n * DAY).toISOString().slice(0, 10); }
  function monthsBack(asOf, n) {
    var y = +asOf.slice(0, 4), m = +asOf.slice(5, 7), out = [];
    for (var i = n - 1; i >= 0; i--) {
      var mm = m - i, yy = y;
      while (mm < 1) { mm += 12; yy--; }
      out.push(yy + '-' + (mm < 10 ? '0' : '') + mm);
    }
    return out;
  }
  function monthLabel(k) { return MONTHS[+k.slice(5, 7) - 1] + ' ' + k.slice(2, 4); }
  function todayLocalISO() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  /* Context for one category: "today" (t), due-soon window, 12-month window */
  function makeCtx(asOf, cfg, catKey) {
    var s = (cfg && cfg.settings) || {};
    var hm = +s.history_months > 0 ? +s.history_months : 12;
    var cc = cfg && cfg.categories && cfg.categories[catKey];
    var soon = (cc && cc.due_soon_days != null && cc.due_soon_days !== '') ? +cc.due_soon_days :
      (s.default_due_soon_days != null && s.default_due_soon_days !== '' ? +s.default_due_soon_days : 14);
    var t = isISO(asOf) ? dn(asOf) : null;
    var months = t != null ? monthsBack(asOf, hm) : [];
    var from = months.length ? dn(months[0] + '-01') : null;
    return {
      asOf: asOf, t: t, soon: soon, months: months, from: from, cfg: cfg || {},
      historyMonths: hm,
      /* inside the history window: first day of the oldest month .. data_as_of */
      inWin: function (iso) { return !!iso && t != null && dn(iso) >= from && dn(iso) <= t; },
      overdue: function (iso) { return !!iso && t != null && dn(iso) < t; },
      dueSoon: function (iso) { return !!iso && t != null && dn(iso) >= t && dn(iso) <= t + soon; },
      lastDays: function (iso, n) { return !!iso && t != null && dn(iso) > t - n && dn(iso) <= t; }
    };
  }

  /* ------------------------------------------------------------------------
     4. SMALL HELPERS FOR SHAPES
     ------------------------------------------------------------------------ */
  function col(name, type, o) {
    o = o || {};
    return {
      name: name, type: type,
      req: o.req === undefined ? true : o.req,     /* value always required */
      reqIf: o.reqIf || null,                      /* function(row) -> required? */
      reqText: o.reqText || '',
      optionalHeader: !!o.optionalHeader,          /* column may be missing from the sheet */
      values: o.values || null,                    /* allowed values for enum */
      help: o.help || '', example: o.example == null ? '' : o.example
    };
  }
  function where(rows, f) { return rows.filter(f); }
  function isStatus(field, v) { return function (r) { return r[field] === v; }; }
  function P(label, rows, o) {
    o = o || {};
    return { label: label, rows: rows, value: o.value != null ? o.value : rows.length,
      sub: o.sub || '', tone: o.tone || '', def: o.def || '', ratio: o.ratio == null ? null : o.ratio };
  }
  function tone(n, t) { return n > 0 ? t : ''; }
  function pct(num, den) { return den ? Math.round(num / den * 100) + '%' : '–'; }
  function PP(label, num, den, def) {
    return P(label, den, { value: pct(num.length, den.length), sub: num.length + ' / ' + den.length, def: def,
      ratio: den.length ? num.length / den.length : null });
  }
  function avg(arr) { if (!arr.length) return null; var s = 0; arr.forEach(function (x) { s += x; }); return s / arr.length; }
  function fmt1(x) { return x == null ? '–' : (Math.round(x * 10) / 10).toString(); }

  /* Monthly counts over the history window for one date field */
  function monthly(rows, field, ctx, filter) {
    var idx = {}, vals = [], rws = [];
    ctx.months.forEach(function (m, i) { idx[m] = i; vals.push(0); rws.push([]); });
    rows.forEach(function (r) {
      var v = r[field];
      if (!v || (filter && !filter(r)) || !ctx.inWin(v)) return;
      var i = idx[v.slice(0, 7)];
      if (i != null) { vals[i]++; rws[i].push(r); }
    });
    return { values: vals, rows: rws };
  }
  function series(name, m) { return { name: name, values: m.values, rows: m.rows }; }

  function ageBuckets(rows, field, ctx, label) {
    var b = [
      { label: '0–30 days', rows: [] }, { label: '31–60 days', rows: [] },
      { label: '61–90 days', rows: [] }, { label: 'Over 90 days', rows: [] },
      { label: 'No date', rows: [] }
    ];
    rows.forEach(function (r) {
      if (!r[field] || ctx.t == null) { b[4].rows.push(r); return; }
      var a = ctx.t - dn(r[field]);
      b[a <= 30 ? 0 : a <= 60 ? 1 : a <= 90 ? 2 : 3].rows.push(r);
    });
    var panels = b.filter(function (x, i) { return i < 4 || x.rows.length; }).map(function (x, i) {
      return P(x.label, x.rows, { tone: i === 3 ? tone(x.rows.length, 'bad') : '' });
    });
    return { title: label, panels: panels, kind: 'age' };
  }

  function breakdown(title, rows, keyFn, order) {
    var map = {}, keys = [];
    rows.forEach(function (r) {
      var k = keyFn(r); if (k == null || k === '') k = '(blank)';
      if (!map[k]) { map[k] = []; keys.push(k); }
      map[k].push(r);
    });
    if (order) keys.sort(function (a, b) {
      var ia = order.indexOf(a), ib = order.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    }); else keys.sort(function (a, b) { return map[b].length - map[a].length || (a < b ? -1 : 1); });
    return { title: title, total: rows.length, items: keys.map(function (k) { return { label: k, rows: map[k] }; }) };
  }

  /* An attention item = one row that is overdue or due soon */
  function attn(r, id, title, owner, date, dateLabel, ctx) {
    var d = ctx.t - dn(date);
    return { _src: r, record: r[id], title: title ? r[title] : '', owner: owner ? r[owner] : '',
      date: date, date_label: dateLabel, days: d,
      state: d > 0 ? 'Overdue' : 'Due soon',
      state_text: d > 0 ? 'Overdue ' + d + ' d' : (d === 0 ? 'Due today' : 'Due in ' + (-d) + ' d') };
  }

  /* ------------------------------------------------------------------------
     5. SHAPES  (columns + validation + metrics for each kind of data)
        compute() returns:
          groups     : [{title, panels:[P(...)]}]  clickable KPI cards
          breakdowns : [{title, items:[{label, rows}]}]
          charts     : [{title, series:[{name, values, rows}]}] per history month
          strip      : {overdue:[rows], dueSoon:[rows]} for the header strip
          attention  : [attn(...)] for the "Needs attention" list
     ------------------------------------------------------------------------ */
  var EVENT_STATUS = ['Open', 'Closed', 'Cancelled'];

  function eventColumns() {
    return [
      col('record_id', 'text', { help: 'Unique record number', example: 'CAPA-2026-0142' }),
      col('title', 'text', { example: 'Revise HPLC column storage procedure' }),
      col('owner', 'text', { example: 'A. Rahman' }),
      col('status', 'enum', { values: EVENT_STATUS, example: 'Open' }),
      col('open_date', 'date', { example: '2026-09-14' }),
      col('due_date', 'date', { req: false, reqIf: function (r) { return r.status === 'Open'; },
        reqText: 'Required when status is Open', example: '2026-11-30' }),
      col('close_date', 'date', { req: false, reqIf: function (r) { return r.status === 'Closed'; },
        reqText: 'Required when status is Closed', example: '' }),
      col('severity', 'text', { req: false, optionalHeader: true, help: 'Optional, e.g. Minor / Major / Critical', example: 'Major' }),
      col('stage', 'text', { req: false, optionalHeader: true, help: 'Optional, display only, e.g. In investigation', example: 'In investigation' })
    ];
  }
  function eventCheck(r, ctx) {
    var w = [];
    if (r.close_date && r.open_date && dn(r.close_date) < dn(r.open_date)) w.push(['close_date', 'Close date is before open date']);
    if (r.due_date && r.open_date && dn(r.due_date) < dn(r.open_date)) w.push(['due_date', 'Due date is before open date']);
    if (r.status === 'Open' && r.close_date) w.push(['close_date', 'Status is Open but a close date is filled in']);
    if (ctx.t != null && r.open_date && dn(r.open_date) > ctx.t) w.push(['open_date', 'Open date is after data_as_of']);
    if (ctx.t != null && r.close_date && dn(r.close_date) > ctx.t) w.push(['close_date', 'Close date is after data_as_of']);
    return w;
  }
  function eventCompute(rows, ctx, splitField, splitValues) {
    var t = ctx.t;
    rows.forEach(function (r) {
      r._age_days = ''; r._days_overdue = ''; r._on_time = '';
      if (r.status === 'Open') {
        if (r.open_date) r._age_days = t - dn(r.open_date);
        if (ctx.overdue(r.due_date)) r._days_overdue = t - dn(r.due_date);
      }
      if (r.status === 'Closed' && r.close_date && r.due_date) r._on_time = dn(r.close_date) <= dn(r.due_date) ? 'Yes' : 'No';
    });
    var open = where(rows, isStatus('status', 'Open'));
    var overdue = where(open, function (r) { return ctx.overdue(r.due_date); });
    var soon = where(open, function (r) { return ctx.dueSoon(r.due_date); });
    var closed = where(rows, isStatus('status', 'Closed'));
    var closed30 = where(closed, function (r) { return ctx.lastDays(r.close_date, 30); });
    var closedWin = where(closed, function (r) { return ctx.inWin(r.close_date) && r.due_date; });
    var onTime = where(closedWin, function (r) { return r._on_time === 'Yes'; });
    var cancelled = where(rows, isStatus('status', 'Cancelled'));
    var unknown = where(rows, function (r) { return EVENT_STATUS.indexOf(r.status) < 0; });
    var subAll = cancelled.length + ' cancelled' + (unknown.length ? ', ' + unknown.length + ' unknown status' : '');

    var groups = [
      { title: 'Status', panels: [
        P('Open', open, { def: 'Status = Open' }),
        P('Overdue', overdue, { tone: tone(overdue.length, 'bad'), def: 'Open and due date before data_as_of' }),
        P('Due soon', soon, { tone: tone(soon.length, 'warn'), sub: 'within ' + ctx.soon + ' days',
          def: 'Open and due between data_as_of and data_as_of + ' + ctx.soon + ' days' }),
        P('Closed, last 30 days', closed30, { def: 'Closed with close date in the 30 days up to data_as_of' }),
        PP('Closed on time, ' + ctx.historyMonths + ' months', onTime, closedWin,
          'Closed in the window with close date on or before due date / all closed in the window that have a due date'),
        P('All records in file', rows, { sub: subAll, def: 'Every row loaded from the sheet, including cancelled' })
      ] },
      ageBuckets(open, 'open_date', ctx, 'Open records by age (days since open date)')
    ];
    var breakdowns = [];
    if (splitField) breakdowns.push(breakdown('Open by ' + splitField.replace(/_/g, ' '), open, function (r) { return r[splitField]; }, splitValues));
    if (open.some(function (r) { return r.severity; })) breakdowns.push(breakdown('Open by severity', open, function (r) { return r.severity; }));
    if (open.some(function (r) { return r.stage; })) breakdowns.push(breakdown('Open by stage', open, function (r) { return r.stage; }));

    var charts = [{ title: 'Opened vs closed per month', series: [
      series('Opened', monthly(rows, 'open_date', ctx, function (r) { return r.status !== 'Cancelled'; })),
      series('Closed', monthly(rows, 'close_date', ctx, function (r) { return r.status === 'Closed'; }))
    ] }];
    var attention = overdue.concat(soon).map(function (r) {
      return attn(r, 'record_id', 'title', 'owner', r.due_date, 'Due', ctx);
    });
    return { groups: groups, breakdowns: breakdowns, charts: charts,
      strip: { overdue: overdue, dueSoon: soon }, attention: attention };
  }
  var EVENT_DRILL = [
    ['_row', 'Row'], ['record_id', 'Record ID'], ['title', 'Title'], ['owner', 'Owner'], ['status', 'Status'],
    ['stage', 'Stage'], ['severity', 'Severity'], ['open_date', 'Opened'], ['due_date', 'Due'],
    ['close_date', 'Closed'], ['_age_days', 'Age (d)'], ['_days_overdue', 'Days overdue'], ['_on_time', 'On time']
  ];
  var EVENT_DEFS = [
    'Open = status Open. Cancelled records are excluded from every count except "All records in file".',
    'Overdue = Open and due_date before data_as_of. A record due on data_as_of is not overdue.',
    'Due soon = Open and due_date from data_as_of up to data_as_of + due_soon_days (config).',
    'Closed on time = close_date on or before due_date, for records closed in the history window.',
    'Age = data_as_of minus open_date, in calendar days.'
  ];

  var ADHOC_TYPES = ['Request', 'Troubleshooting'];

  var SHAPES = {
    /* ---- QMS event: CAPA, Deviation, OOS, OOT ---- */
    event: {
      columns: eventColumns(),
      check: eventCheck,
      compute: function (rows, ctx) { return eventCompute(rows, ctx); },
      drill: EVENT_DRILL,
      defs: EVENT_DEFS
    },

    /* ---- Ad hoc CSV requests: event columns + type ---- */
    adhoc: {
      columns: eventColumns().concat([col('type', 'enum', { values: ADHOC_TYPES, example: 'Troubleshooting' })]),
      check: eventCheck,
      compute: function (rows, ctx) { return eventCompute(rows, ctx, 'type', ADHOC_TYPES); },
      drill: EVENT_DRILL.slice(0, 5).concat([['type', 'Type']]).concat(EVENT_DRILL.slice(5)),
      defs: EVENT_DEFS.concat(['Type splits open records into Request and Troubleshooting.'])
    },

    /* ---- Batch TAT ---- */
    tat: {
      columns: [
        col('record_id', 'text', { help: 'Batch or sample number', example: 'B26-0417' }),
        col('product', 'text', { example: 'Product A 50 mg' }),
        col('start_date', 'date', { help: 'Sample received in QC', example: '2026-10-01' }),
        col('end_date', 'date', { req: false, help: 'QC result approved. Blank while in progress', example: '2026-10-08' }),
        col('target_days', 'int', { help: 'Target TAT in calendar days', example: 7 })
      ],
      check: function (r, ctx) {
        var w = [];
        if (r.end_date && r.start_date && dn(r.end_date) < dn(r.start_date)) w.push(['end_date', 'End date is before start date']);
        if (r.target_days != null && r.target_days <= 0) w.push(['target_days', 'Target days must be greater than 0']);
        if (ctx.t != null && r.end_date && dn(r.end_date) > ctx.t) w.push(['end_date', 'End date is after data_as_of']);
        return w;
      },
      compute: function (rows, ctx) {
        var t = ctx.t;
        rows.forEach(function (r) {
          r._tat_days = ''; r._elapsed_days = ''; r._target_date = ''; r._within = '';
          if (!r.start_date) return;
          if (r.target_days != null) r._target_date = isoFromDn(dn(r.start_date) + r.target_days);
          if (r.end_date) {
            r._tat_days = dn(r.end_date) - dn(r.start_date);
            if (r.target_days != null) r._within = r._tat_days <= r.target_days ? 'Yes' : 'No';
          } else r._elapsed_days = t - dn(r.start_date);
        });
        var done = where(rows, function (r) { return r.end_date && r.start_date && ctx.inWin(r.end_date); });
        var scored = where(done, function (r) { return r._within !== ''; });
        var within = where(scored, function (r) { return r._within === 'Yes'; });
        var breached = where(scored, function (r) { return r._within === 'No'; });
        var prog = where(rows, function (r) { return !r.end_date && r.start_date; });
        var late = where(prog, function (r) { return r._target_date && ctx.overdue(r._target_date); });
        var soon = where(prog, function (r) { return r._target_date && ctx.dueSoon(r._target_date); });
        var a = avg(done.map(function (r) { return r._tat_days; }));
        return {
          groups: [
            { title: 'Completed, last ' + ctx.historyMonths + ' months', panels: [
              P('Completed', done, { def: 'end_date in the history window' }),
              PP('Within target', within, scored, 'TAT days (end - start) <= target_days / completed in window'),
              P('Breached target', breached, { tone: tone(breached.length, 'bad'), def: 'TAT days > target_days' }),
              P('Average TAT', done, { value: a == null ? '–' : fmt1(a) + ' d', sub: 'over ' + done.length + ' batches',
                def: 'Mean of end_date - start_date in calendar days, completed in window' })
            ] },
            { title: 'In progress', panels: [
              P('In progress', prog, { def: 'No end_date yet' }),
              P('Past target', late, { tone: tone(late.length, 'bad'), def: 'In progress and start_date + target_days is before data_as_of' }),
              P('Target due soon', soon, { tone: tone(soon.length, 'warn'), sub: 'within ' + ctx.soon + ' days',
                def: 'In progress and target date within the due-soon window' })
            ] }
          ],
          breakdowns: [breakdown('Breached by product', breached, function (r) { return r.product; })],
          charts: [{ title: 'Completed per month: within vs breached target', series: [
            series('Within target', monthly(rows, 'end_date', ctx, function (r) { return r._within === 'Yes'; })),
            series('Breached', monthly(rows, 'end_date', ctx, function (r) { return r._within === 'No'; }))
          ] }],
          strip: { overdue: late, dueSoon: soon },
          attention: late.concat(soon).map(function (r) { return attn(r, 'record_id', 'product', null, r._target_date, 'Target', ctx); })
        };
      },
      drill: [['_row', 'Row'], ['record_id', 'Batch'], ['product', 'Product'], ['start_date', 'Start'], ['end_date', 'End'],
        ['target_days', 'Target (d)'], ['_target_date', 'Target date'], ['_tat_days', 'TAT (d)'], ['_within', 'Within target'], ['_elapsed_days', 'Elapsed (d)']],
      defs: [
        'TAT = end_date minus start_date in calendar days. Start = sample received in QC; end = QC result approved.',
        'Within target = TAT days <= target_days, for batches completed in the history window.',
        'Past target = no end_date and start_date + target_days is before data_as_of.'
      ]
    },

    /* ---- Samples ---- */
    samples: {
      columns: [
        col('sample_id', 'text', { example: 'S26-10233' }),
        col('description', 'text', { example: 'Product A 50 mg, release, batch B26-0417' }),
        col('stage', 'enum', { values: ['Received', 'On Progress', 'Release'], example: 'On Progress' }),
        col('received_date', 'date', { example: '2026-10-20' }),
        col('start_date', 'date', { req: false, reqIf: function (r) { return r.stage === 'On Progress'; },
          reqText: 'Required when stage is On Progress', example: '2026-10-21' }),
        col('release_date', 'date', { req: false, reqIf: function (r) { return r.stage === 'Release'; },
          reqText: 'Required when stage is Release', example: '' }),
        col('target_date', 'date', { req: false, reqIf: function (r) { return r.stage && r.stage !== 'Release'; },
          reqText: 'Required until the sample is released', example: '2026-11-04' })
      ],
      check: function (r, ctx) {
        var w = [];
        if (r.release_date && r.received_date && dn(r.release_date) < dn(r.received_date)) w.push(['release_date', 'Release date is before received date']);
        if (r.start_date && r.received_date && dn(r.start_date) < dn(r.received_date)) w.push(['start_date', 'Start date is before received date']);
        if (r.stage !== 'Release' && r.release_date) w.push(['release_date', 'Release date filled but stage is not Release']);
        return w;
      },
      compute: function (rows, ctx) {
        var t = ctx.t;
        rows.forEach(function (r) {
          r._age_days = ''; r._lead_days = ''; r._days_overdue = '';
          if (r.stage === 'Release') { if (r.release_date && r.received_date) r._lead_days = dn(r.release_date) - dn(r.received_date); }
          else {
            if (r.received_date) r._age_days = t - dn(r.received_date);
            if (ctx.overdue(r.target_date)) r._days_overdue = t - dn(r.target_date);
          }
        });
        var rec = where(rows, isStatus('stage', 'Received'));
        var prog = where(rows, isStatus('stage', 'On Progress'));
        var rel = where(rows, isStatus('stage', 'Release'));
        var open = rec.concat(prog);
        var rel30 = where(rel, function (r) { return ctx.lastDays(r.release_date, 30); });
        var relWin = where(rel, function (r) { return ctx.inWin(r.release_date) && r._lead_days !== ''; });
        var overdue = where(open, function (r) { return ctx.overdue(r.target_date); });
        var soon = where(open, function (r) { return ctx.dueSoon(r.target_date); });
        var a = avg(relWin.map(function (r) { return r._lead_days; }));
        return {
          groups: [
            { title: 'Stage', panels: [
              P('Received', rec, { def: 'Stage = Received' }),
              P('On Progress', prog, { def: 'Stage = On Progress' }),
              P('Released, last 30 days', rel30, { def: 'Stage = Release with release date in the 30 days up to data_as_of' }),
              P('Overdue', overdue, { tone: tone(overdue.length, 'bad'), def: 'Not released and target date before data_as_of' }),
              P('Due soon', soon, { tone: tone(soon.length, 'warn'), sub: 'within ' + ctx.soon + ' days', def: 'Not released and target date within the due-soon window' }),
              P('Avg received to release', relWin, { value: a == null ? '–' : fmt1(a) + ' d',
                sub: relWin.length + ' released, ' + ctx.historyMonths + ' months', def: 'Mean of release_date - received_date for samples released in the window' })
            ] },
            ageBuckets(open, 'received_date', ctx, 'Not released, by age (days since received)')
          ],
          breakdowns: [],
          charts: [{ title: 'Received vs released per month', series: [
            series('Received', monthly(rows, 'received_date', ctx)),
            series('Released', monthly(rows, 'release_date', ctx, function (r) { return r.stage === 'Release'; }))
          ] }],
          strip: { overdue: overdue, dueSoon: soon },
          attention: overdue.concat(soon).map(function (r) { return attn(r, 'sample_id', 'description', null, r.target_date, 'Target', ctx); })
        };
      },
      drill: [['_row', 'Row'], ['sample_id', 'Sample ID'], ['description', 'Description'], ['stage', 'Stage'],
        ['received_date', 'Received'], ['start_date', 'Started'], ['target_date', 'Target'], ['release_date', 'Released'],
        ['_age_days', 'Age (d)'], ['_days_overdue', 'Days overdue'], ['_lead_days', 'Received to release (d)']],
      defs: [
        'Stages: Received, On Progress, Release. Release is the final stage.',
        'Overdue = not released and target_date before data_as_of.',
        'Received to release = release_date minus received_date in calendar days.'
      ]
    },

    /* ---- Periodic Review: planned, executed, completed ---- */
    pr: {
      columns: [
        col('record_id', 'text', { example: 'PR-2026-011' }),
        col('system', 'text', { example: 'Empower 3 CDS' }),
        col('planned_date', 'date', { example: '2026-10-15' }),
        col('executed_date', 'date', { req: false, help: 'Review executed', example: '2026-10-16' }),
        col('completed_date', 'date', { req: false, help: 'Review report approved', example: '' })
      ],
      check: function (r) {
        var w = [];
        if (r.completed_date && !r.executed_date) w.push(['executed_date', 'Completed date filled but executed date is blank']);
        if (r.completed_date && r.executed_date && dn(r.completed_date) < dn(r.executed_date)) w.push(['completed_date', 'Completed date is before executed date']);
        return w;
      },
      compute: function (rows, ctx) {
        rows.forEach(function (r) {
          r._state = r.completed_date ? 'Completed' : (r.executed_date ? 'Executed, pending completion' : 'Not executed');
          r._days_overdue = (!r.executed_date && ctx.overdue(r.planned_date)) ? ctx.t - dn(r.planned_date) : '';
        });
        var den = where(rows, function (r) { return ctx.inWin(r.planned_date); });
        var exe = where(den, function (r) { return r.executed_date; });
        var comp = where(den, function (r) { return r.completed_date; });
        var overdue = where(rows, function (r) { return !r.executed_date && ctx.overdue(r.planned_date); });
        var soon = where(rows, function (r) { return !r.executed_date && ctx.dueSoon(r.planned_date); });
        var pending = where(rows, function (r) { return r.executed_date && !r.completed_date; });
        return {
          groups: [
            { title: 'Planned in the last ' + ctx.historyMonths + ' months (to data_as_of)', panels: [
              P('Planned', den, { def: 'planned_date in the history window, up to data_as_of' }),
              PP('Executed', exe, den, 'Executed / planned in window'),
              PP('Completed', comp, den, 'Completed / planned in window')
            ] },
            { title: 'Follow-up', panels: [
              P('Overdue execution', overdue, { tone: tone(overdue.length, 'bad'), def: 'Not executed and planned_date before data_as_of' }),
              P('Due soon', soon, { tone: tone(soon.length, 'warn'), sub: 'within ' + ctx.soon + ' days', def: 'Not executed and planned within the due-soon window' }),
              P('Pending completion', pending, { tone: tone(pending.length, 'warn'), def: 'Executed but no completed_date' })
            ] }
          ],
          breakdowns: [],
          charts: [{ title: 'Planned vs executed vs completed, by planned month', series: [
            series('Planned', monthly(rows, 'planned_date', ctx)),
            series('Executed', monthly(rows, 'planned_date', ctx, function (r) { return r.executed_date; })),
            series('Completed', monthly(rows, 'planned_date', ctx, function (r) { return r.completed_date; }))
          ] }],
          strip: { overdue: overdue, dueSoon: soon },
          attention: overdue.concat(soon).map(function (r) { return attn(r, 'record_id', 'system', null, r.planned_date, 'Planned', ctx); })
        };
      },
      drill: [['_row', 'Row'], ['record_id', 'Record ID'], ['system', 'System'], ['planned_date', 'Planned'],
        ['executed_date', 'Executed'], ['completed_date', 'Completed'], ['_state', 'State'], ['_days_overdue', 'Days overdue']],
      defs: [

    },

    /* ---- Planner activities: time sync, UAM, backup, restoration, OS hardening ---- */
    planner: {
      columns: [
        col('record_id', 'text', { example: 'TS-2026-10-001' }),
        col('computer_id', 'text', { example: 'QC-PC-0142' }),
        col('planned_date', 'date', { example: '2026-10-15' }),

        ['actual_date', 'Actual'], ['status', 'Status'], ['_days_overdue', 'Days overdue']],
      defs: [

    /* ---- IT risk and remediation (migration of aging systems) ---- */
    itrisk: {
      columns: [
        col('computer_id', 'text', { example: 'QC-PC-0142' }),

        col('os_version', 'text', { help: 'e.g. 22H2, 1809, 24.04 LTS', example: '22H2' }),
        col('ssd_count', 'int', { help: '0 if none', example: 1 }),
        col('ssd_gb', 'number', { help: 'Total SSD capacity in GB, 0 if none', example: 256 }),
        col('hdd_count', 'int', { help: '0 if none', example: 1 }),
        col('hdd_gb', 'number', { help: 'Total HDD capacity in GB, 0 if none', example: 1000 }),
        col('ram_gb', 'number', { example: 8 }),
        col('hardware_replacement_needed', 'enum', { values: ['Yes', 'No', 'N/A'], help: 'N/A for Azure servers', example: 'Yes' }),
        col('migration_status', 'enum', { values: ['Not required', 'Not started', 'Planned', 'In progress', 'Completed', 'On hold'], example: 'Planned' }),
        col('planned_migration_date', 'date', { req: false,
          reqIf: function (r) { return r.migration_status === 'Planned' || r.migration_status === 'In progress' || r.migration_status === 'On hold'; },
          reqText: 'Required when status is Planned, In progress or On hold', example: '2026-12-15' }),
        col('completed_date', 'date', { req: false, reqIf: function (r) { return r.migration_status === 'Completed'; },
          reqText: 'Required when status is Completed', example: '' })
      ],
      check: function (r, ctx) {
        var w = [], cur = osIsCurrent(r.os_name, r.os_version, ctx.cfg.currentOS);
        if (r.migration_status === 'Completed' && !cur) w.push(['os_name', 'Migration Completed but OS is not on the Current OS list']);
        if (r.migration_status === 'Not required' && !cur) w.push(['migration_status', 'Not required but OS is not on the Current OS list']);
        if (r.migration_status === 'Not required' && r.hardware_replacement_needed === 'Yes') w.push(['migration_status', 'Not required but hardware replacement is Yes']);
        if (r.ssd_count === 0 && r.ssd_gb > 0) w.push(['ssd_gb', 'SSD count is 0 but SSD size is above 0']);

      },

        var hwYes = where(hwDen, isStatus('hardware_replacement_needed', 'Yes'));

        return {
          groups: [

            { title: 'Migration', panels: [
              PP('Completed', comp, scope, 'Completed / all systems with a migration (status other than Not required)'),
              P('Overdue', overdue, { tone: tone(overdue.length, 'bad'), def: 'Not completed and planned_migration_date before data_as_of' }),
              P('Due soon', soon, { tone: tone(soon.length, 'warn'), sub: 'within ' + ctx.soon + ' days', def: 'Not completed and planned within the due-soon window' }),
              P('Not started', notStarted, { def: 'migration_status Not started' }),
              P('On hold', hold, { tone: tone(hold.length, 'warn'), def: 'migration_status On hold' })
            ] },
            { title: 'Hardware', panels: [
              PP('Hardware replacement needed', hwYes, hwDen, 'Yes / systems marked Yes or No (N/A excluded)'),
              P('HDD only (no SSD)', hddOnly, { def: 'hdd_count above 0 and ssd_count = 0' })
            ] }
          ],
          breakdowns: [
            breakdown('By OS', rows, function (r) { return r._os + ' (' + r._os_current + ')'; }),
            breakdown('By migration status', rows, function (r) { return r.migration_status; },
              ['Not started', 'Planned', 'In progress', 'On hold', 'Completed', 'Not required']),
            breakdown('By system type', rows, function (r) { return r.system_type; }, ['Workstation', 'On-prem server', 'Azure server']),
            breakdown('By RAM', rows, function (r) { return r._ram_band; }, RAM_BANDS)
          ],
          charts: [],
          strip: { overdue: overdue, dueSoon: soon },
          attention: overdue.concat(soon).map(function (r) { return attn(r, 'computer_id', '_os', null, r.planned_migration_date, 'Planned migration', ctx); })
        };
      },
      drill: [['_row', 'Row'], ['computer_id', 'Computer ID'], ['system_type', 'Type'], ['os_name', 'OS'], ['os_version', 'Version'],
        ['_os_current', 'OS state'], ['_storage', 'Storage'], ['ram_gb', 'RAM (GB)'], ['hardware_replacement_needed', 'HW replacement'],
        ['migration_status', 'Migration'], ['planned_migration_date', 'Planned'], ['completed_date', 'Completed'], ['_days_overdue', 'Days overdue']],
      defs: [
        'An OS is current when "os_name os_version" starts with an entry from config.xlsx > CurrentOS (case and extra spaces ignored). Everything else is Old.',
        'Migration scope = every system whose migration_status is not "Not required".',
        'Overdue migration = not Completed and planned_migration_date before data_as_of.'
      ]
    }
  };

  var RAM_BANDS = ['Under 8 GB', '8–15 GB', '16–31 GB', '32 GB and above', '(blank)'];
  function ramBand(g) {
    if (g == null || g === '') return '(blank)';
    return g < 8 ? RAM_BANDS[0] : g < 16 ? RAM_BANDS[1] : g < 32 ? RAM_BANDS[2] : RAM_BANDS[3];
  }
  function storageText(r) {
    var p = [];
    if (r.ssd_count) p.push(r.ssd_count + ' SSD (' + r.ssd_gb + ' GB)');
    if (r.hdd_count) p.push(r.hdd_count + ' HDD (' + r.hdd_gb + ' GB)');
    return p.join(' + ') || 'None';
  }
  function normOS(s) { return String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ' ').trim(); }
  /* Current if "name version" starts with a configured "name version_prefix",
     and the next character is not a letter or digit (so "Windows 11" never matches "Windows 110"). */
  function osIsCurrent(name, version, list) {
    var full = normOS(name + ' ' + (version == null ? '' : version));
    return (list || []).some(function (c) {
      var p = normOS(c.os_name + ' ' + (c.os_version_prefix == null ? '' : c.os_version_prefix));
      if (!p || full.indexOf(p) !== 0) return false;
      var next = full.charAt(p.length);
      return next === '' || !/[a-z0-9]/.test(next);
    });
  }

  /* ------------------------------------------------------------------------
     6. COMPUTE ALL  (data -> results per department and category)
     ------------------------------------------------------------------------ */
  function computeAll(data) {
    var out = {};
    DEPTS.forEach(function (d) {
      var dd = data.depts[d.key]; if (!dd) return;
      out[d.key] = {};
      CATEGORIES.forEach(function (c) {
        var rows = (dd.sheets && dd.sheets[c.key]) || [];
        var ctx = makeCtx(dd.as_of, data.config, c.key);
        var res = SHAPES[c.shape].compute(rows, ctx);
        res.cat = c; res.ctx = ctx; res.rows = rows;
        res.attention.forEach(function (a) { a.category = c.label; a.dept = d.key; });
        out[d.key][c.key] = res;
      });
    });
    return out;
  }

  /* ------------------------------------------------------------------------
     7. RENDERING  (presentation only: nothing in this section changes a number)

  function esc(s) {

    });
  }
  function fmtDate(iso) {

  var ICON = {

  };
  var ATTN_DRILL = [['dept', 'Dept'], ['category', 'Category'], ['record', 'ID'], ['title', 'Title / item'],
    ['owner', 'Owner'], ['date_label', 'Date type'], ['date', 'Date'], ['state_text', 'Status']];
  /* drill-down columns allowed to wrap; all others stay on one line */
  var WRAP_COLS = /^(title|description|message|product|system|_storage|stage)$/;

  function App(el, data) {
    this.el = el; this.data = data;

  App.prototype.reg = function (title, rows, cols) {

  App.prototype.attention = function (dept) {

  App.prototype.summary = function (dept) {

      s.overdue += o; s.soon += d; if (o) s.cats++;
      var b = s.bySection[c.section] || (s.bySection[c.section] = { overdue: 0, soon: 0 });

  App.prototype.isStale = function (dept) {

  /* status matrix: every category, both departments, overdue and due soon */
  App.prototype.matrixHTML = function () {

      .filter(function (g) { return g.cats.length; });
    /* split the sections into two balanced columns */
    var total = CATEGORIES.length, run = 0, cols = [[], []];

    var table = function (gs) {

              var rows = r ? r.strip[k[0]] : [];

  App.prototype.sectionHTML = function () {

    if (!this.data.depts[dept]) return '<p class="empty">No data was loaded for ' + dept + '.</p>';

    var cur = this.state.cat[s] || cats[0].key;

    if (cats.length > 1) {

  App.prototype.categoryHTML = function (dept, r) {

  App.prototype.kpiGroupHTML = function (base, g, drill) {

  App.prototype.kpiHTML = function (title, p, drill) {

  /* ageing buckets as one segmented bar (ordinal blue ramp, light = young, dark = old) */
  App.prototype.ageHTML = function (base, g, drill) {
    var self = this, total = 0;
    g.panels.forEach(function (p) { total += p.rows.length; });
    var h = '<section class="kgroup"><h3>' + esc(g.title) + '</h3><div class="age">';

      h += '<button class="seg-' + Math.min(i + 1, 5) + '" style="flex-grow:' + p.rows.length + '" data-drill="' + id + '" data-tip="' +
        esc(p.label + ': ' + p.rows.length + ' of ' + total) + '" aria-label="' + esc(p.label + ' ' + p.rows.length) + '">' +
        (p.rows.length / total >= 0.08 ? p.rows.length : '') + '</button>';
    });
    h += '</div><div class="agekey">';
    g.panels.forEach(function (p, i) {
      var id = p.rows.length ? self.reg(base + ': ' + p.label, p.rows, drill) : '';
      h += '<' + (id ? 'button data-drill="' + id + '"' : 'span') + ' class="agekey-i"><i class="sw seg-' + Math.min(i + 1, 5) + '"></i>' + esc(p.label) +
        ' <b>' + p.rows.length + '</b></' + (id ? 'button' : 'span') + '>';
    });
    return h + '</div></div></section>';
  };
  App.prototype.breakdownHTML = function (base, b, drill) {
    var self = this, max = 0;
    b.items.forEach(function (i) { max = Math.max(max, i.rows.length); });
    var h = '<div class="card viz"><h3>' + esc(b.title) + '</h3>';
    if (!b.items.length) return h + '<p class="empty">No records.</p></div>';
    h += '<div class="bd">';
    b.items.forEach(function (i) {
      var id = self.reg(base + ': ' + b.title + ', ' + i.label, i.rows, drill);
      h += '<button class="bd-row" data-drill="' + id + '"><span class="bd-label" title="' + esc(i.label) + '">' + esc(i.label) + '</span>' +
        '<span class="bd-bar"><i style="width:' + (max ? Math.max(3, i.rows.length / max * 100) : 0) + '%"></i></span>' +
        '<span class="bd-n">' + i.rows.length + '</span></button>';
    });
    return h + '</div></div>';
  };
  App.prototype.chartHTML = function (base, ch, ctx, drill) {
    var self = this, W = 1100, H = 240, L = 34, R = 8, T = 12, B = 28;
    var n = ctx.months.length, s = ch.series.length, max = 0;
    ch.series.forEach(function (se) { se.values.forEach(function (v) { max = Math.max(max, v); }); });
    var step = niceStep(max), top = Math.max(step, Math.ceil(max / step) * step);
    var gw = (W - L - R) / n, bw = Math.min(20, (gw - 14 - (s - 1) * 2) / s);
    var y = function (v) { return T + (H - T - B) * (1 - v / top); };
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(ch.title) + '">';
    for (var v = 0; v <= top; v += step) {
      svg += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>' +
        '<text class="ax" x="' + (L - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
    }
    ctx.months.forEach(function (m, i) {
      var gx = L + i * gw, x0 = gx + (gw - (s * bw + (s - 1) * 2)) / 2;
      svg += '<text class="ax" x="' + (gx + gw / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + monthLabel(m) + '</text>';
      ch.series.forEach(function (se, k) {
        var val = se.values[i], x = x0 + k * (bw + 2);
        var tip = monthLabel(m) + ', ' + se.name + ': ' + val;
        var id = val ? self.reg(base + ': ' + se.name + ', ' + monthLabel(m), se.rows[i], drill) : '';
        svg += '<rect class="hit" x="' + (x - 1) + '" y="' + T + '" width="' + (bw + 2) + '" height="' + (H - T - B) + '" data-tip="' + esc(tip) + '"' +
          (id ? ' data-drill="' + id + '"' : '') + '/>';
        if (val) svg += '<path class="bar s' + (k + 1) + '" d="' + barPath(x, y(val), bw, y(0) - y(val)) + '" data-tip="' + esc(tip) + '" data-drill="' + id + '"/>';
      });
    });
    svg += '<line class="base" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0) + '" y2="' + y(0) + '"/></svg>';
    var legend = '<div class="legend">' + ch.series.map(function (se, k) {
      var tot = 0; se.values.forEach(function (x) { tot += x; });
      return '<span><i class="sw s' + (k + 1) + '"></i>' + esc(se.name) + ' <b>' + tot + '</b></span>';
    }).join('') + '</div>';
    return '<div class="card viz wide"><div class="viz-head"><h3>' + esc(ch.title) + '</h3>' + legend + '</div>' + svg +
      '<p class="note">Last ' + n + ' months up to the data date. Select a bar to list its records.</p></div>';
  };
  function niceStep(max) {
    if (max <= 4) return 1;
    var raw = max / 4, mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), f = raw / mag;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * mag;
  }
  function barPath(x, y, w, h) {
    var r = Math.min(4, w / 2, h);
    return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y +
      'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
  }

  App.prototype.overviewHTML = function (dept) {
    var self = this, s = this.summary(dept), dd = this.data.depts[dept];
    var h = '<div class="head"><h2>' + esc(dept) + ' overview</h2><p>Data as of ' + esc(fmtDate(dd.as_of)) +

    h += '<div class="ov">';
    /* needs attention */
    h += '<section class="card ov-main"><div class="card-head"><h2>Needs attention</h2><p class="key">Overdue first, oldest at the top, then items due soon.</p></div>';
    if (!s.att.length) h += '<p class="empty">' + ICON.ok + ' Nothing is overdue or due soon in ' + dept + '.</p>';
    else {
      var top = s.att.slice(0, 20);
      h += '<div class="tbl-wrap"><table class="list"><thead><tr><th>Status</th><th>Category</th><th>ID</th><th>Title or item</th><th>Owner</th><th>Date</th></tr></thead><tbody>';
      top.forEach(function (a) {
        var bad = a.state === 'Overdue';
        h += '<tr><td class="nw"><span class="tag ' + (bad ? 'bad' : 'warn') + '">' + (bad ? ICON.bad : ICON.warn) + esc(a.state_text) + '</span></td>' +
          '<td class="nw">' + esc(a.category) + '</td><td class="nw">' + esc(a.record) + '</td><td>' + esc(a.title) + '</td><td class="nw">' + esc(a.owner) +
          '</td><td class="nw"><span class="muted">' + esc(a.date_label) + '</span> ' + esc(a.date) + '</td></tr>';
      });
      h += '</tbody></table></div>';
      if (s.att.length > top.length) {

        '<span class="secsum-v"><span class="chip bad static' + (b.overdue ? '' : ' none') + '">' + b.overdue + '</span>' +
        '<span class="chip warn static' + (b.soon ? '' : ' none') + '">' + b.soon + '</span></span></button></li>';
    });
    var iss = this.issues(dept).length;
    h += '<li><button data-sec="dq"><span class="secsum-l">Data quality warnings</span><span class="secsum-v"><span class="chip warn static' + (iss ? '' : ' none') + '">' + iss + '</span></span></button></li>';
    h += '</ul><p class="note">Red = overdue, amber = due soon.</p></aside></div>';
    return h;
  };
  App.prototype.dqHTML = function (dept) {
    var dd = this.data.depts[dept], issues = this.issues(dept), h = '';

  /* ---- events ---- */
  App.prototype.onClick = function (e) {
    var t = e.target.closest ? e.target.closest('button, [data-drill], th[data-sort]') : null;
    if (!t) { if (e.target.id === 'qc-modal') this.closeDrill(); return; }
    if (t.dataset.dept) {
      this.state.dept = t.dataset.dept;
      if (t.dataset.sec) this.state.section = t.dataset.sec;
      this.render();
      if (t.dataset.scroll) { var nav = this.el.querySelector('#qc-nav'); if (nav && nav.scrollIntoView) nav.scrollIntoView({ block: 'start' }); }
      return;
    }
    if (t.dataset.sec) { this.state.section = t.dataset.sec; this.render(); return; }
    if (t.dataset.cat) { this.state.cat[this.state.section] = t.dataset.cat; this.render(); return; }
    if (t.dataset.drill) { this.openDrill(t.dataset.drill); return; }
    if (t.dataset.sort) { this.sortBy(t.dataset.sort); return; }
    if (t.dataset.act === 'close') { this.closeDrill(); return; }
    if (t.dataset.act === 'csv') { this.exportCSV(); return; }
    if (t.dataset.act === 'defs') { this.openDefs(); return; }
  };
  App.prototype.onHover = function (e) {
    var t = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (t) this.tip(t.getAttribute('data-tip'), e);
  };
  App.prototype.tip = function (text, e) {
    var el = this.el.querySelector('#qc-tip'); if (!el) return;

    el.textContent = text; el.hidden = false;
    el.style.left = (e.clientX + 12) + 'px'; el.style.top = (e.clientY + 12) + 'px';
  };
  App.prototype.openDrill = function (id) {
    var d = this.drills[id]; if (!d) return;
    this.cur = { title: d.title, rows: d.rows, cols: d.cols, sort: null, dir: 1 };
    var m = this.el.querySelector('#qc-modal');
    m.innerHTML = '<div class="qc-dialog" role="dialog" aria-modal="true" aria-label="' + esc(d.title) + '">' +
      '<div class="qc-dhead"><h2>' + esc(d.title) + '</h2><button class="x" data-act="close" aria-label="Close">&times;</button></div>' +
      '<div class="qc-dtools"><input id="qc-search" type="search" placeholder="Search these rows"> <span id="qc-count" class="muted"></span>' +
      '<button class="btn" data-act="csv">Export CSV</button></div><div class="qc-dbody" id="qc-dbody"></div></div>';
    m.hidden = false;
    this.renderDrillBody();
    var s = m.querySelector('#qc-search'); if (s) s.focus();

  App.prototype.closeDrill = function () {
    var m = this.el.querySelector('#qc-modal'); if (m) { m.hidden = true; m.innerHTML = ''; }
    this.cur = null;
  };
  App.prototype.visibleRows = function () {
    var c = this.cur, q = (this.el.querySelector('#qc-search') || {}).value || '';
    q = q.toLowerCase().trim();
    var rows = c.rows.filter(function (r) {
      if (!q) return true;
      return c.cols.some(function (k) { return String(r[k[0]] == null ? '' : r[k[0]]).toLowerCase().indexOf(q) >= 0; });
    });
    if (c.sort) {
      var k = c.sort, dir = c.dir;
      rows = rows.slice().sort(function (a, b) {
        var x = a[k], y = b[k];
        var ex = x == null || x === '', ey = y == null || y === '';
        if (ex || ey) return ex === ey ? 0 : (ex ? 1 : -1);
        if (typeof x === 'number' && typeof y === 'number') return (x - y) * dir;
        return String(x).localeCompare(String(y), undefined, { numeric: true }) * dir;
      });
    }
    return rows;
  };
  App.prototype.renderDrillBody = function () {
    if (!this.cur) return;
    var c = this.cur, rows = this.visibleRows();
    var h = '<table class="list"><thead><tr>' + c.cols.map(function (k) {
      var arrow = c.sort === k[0] ? (c.dir > 0 ? ' &#9650;' : ' &#9660;') : '';
      return '<th data-sort="' + k[0] + '">' + esc(k[1]) + arrow + '</th>';
    }).join('') + '</tr></thead><tbody>';
    rows.forEach(function (r) {
      h += '<tr>' + c.cols.map(function (k) {
        return '<td class="' + (WRAP_COLS.test(k[0]) ? 'wrap' : 'nw') + '">' + esc(r[k[0]]) + '</td>';
      }).join('') + '</tr>';
    });
    if (!rows.length) h += '<tr><td colspan="' + c.cols.length + '" class="muted">No rows.</td></tr>';
    this.el.querySelector('#qc-dbody').innerHTML = h + '</tbody></table>';
    this.el.querySelector('#qc-count').textContent = rows.length + ' of ' + c.rows.length + ' rows';
  };
  App.prototype.sortBy = function (k) {
    if (!this.cur) return;
    if (this.cur.sort === k) this.cur.dir = -this.cur.dir; else { this.cur.sort = k; this.cur.dir = 1; }
    this.renderDrillBody();
  };
  App.prototype.exportCSV = function () {
    var c = this.cur; if (!c) return;
    var rows = this.visibleRows();
    var cell = function (v) {
      var s = String(v == null ? '' : v);
      if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;   /* stop Excel treating text as a formula */
      return '"' + s.replace(/"/g, '""') + '"';
    };
    var lines = [c.cols.map(function (k) { return cell(k[1]); }).join(',')];
    rows.forEach(function (r) { lines.push(c.cols.map(function (k) { return cell(r[k[0]]); }).join(',')); });
    var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = c.title.replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '') + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
  App.prototype.openDefs = function () {

      '<li>Dates are whole calendar days. Overdue means the date is before data_as_of; due on data_as_of is not overdue.</li>' +

    });

  };

  function mount(el, data) { var a = new App(el, data); a.render(); return a; }
